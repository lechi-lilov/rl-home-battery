# Environment configuration. Battery numbers are ASSUMPTIONS (typical home battery), not measured data;
# they are varied in the sensitivity experiments.
battery:
  capacity_kwh: 10.0
  p_max_kw: 5.0
  eta_charge: 0.95        # one-way efficiency -> round trip 0.95 * 0.95 = 0.9025
  eta_discharge: 0.95
  soc_min_frac: 0.10
  soc_max_frac: 0.90

episode_days: 7           # training episode length (evaluation runs the whole split)
export_price: 0.0         # won/kWh paid for energy exported to the grid (conservative; sensitivity tested)
degradation_cost: 0.0     # won per kWh of battery throughput (0 = off; ablation uses a small positive value)
reward_scale: 100.0       # reward = money / reward_scale, keeps rewards around -1 per step
reward_mode: savings      # "savings": cost_without_battery - cost (default, low-variance); "cost": -cost (ablation)
terminal_value: true      # credit/charge leftover battery energy at the episode end (prevents end-of-episode dumping)
reward_shaping: potential # "none": stored-energy value paid once at the episode end; "potential": paid every step
shaping_gamma: 1.0        # 1.0: the episode's rewards add up exactly to the money saved (see env/energy_env.py)
use_forecast: false       # add persistence forecast features (same hours 24 h earlier)
load_scale_kw: 5.0        # observation scaling only
pv_scale_kw: 5.0
