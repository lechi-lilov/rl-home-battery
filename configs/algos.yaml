# Default hyper-parameters per algorithm (Stable-Baselines3 names). The sweep overrides
# learning_rate and gamma; everything else stays fixed so the comparison is about the algorithm.
# Network: 2 hidden layers of 64 units for every algorithm (same capacity for a fair comparison).
# n_levels: PPO and DQN act on 11 discrete battery set-points (-5..+5 kW in 1 kW steps). A Gaussian PPO on the
# bounded continuous action got stuck at the action bound in all 8 pilots (bias of clipped Gaussians, Chou et al.
# 2017); a categorical policy over discretised actions is the fix of Tang & Agrawal (AAAI 2020). SAC stays continuous.
common:
  net_arch: [64, 64]
  gamma: 0.99

ppo:
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  n_levels: 11

sac:
  learning_rate: 3.0e-4
  buffer_size: 200000
  batch_size: 256
  learning_starts: 5000
  tau: 0.005
  train_freq: 1
  gradient_steps: 1

dqn:
  learning_rate: 1.0e-4
  buffer_size: 200000
  batch_size: 64
  learning_starts: 5000
  target_update_interval: 2000
  train_freq: 4
  exploration_fraction: 0.2
  exploration_final_eps: 0.05
  n_levels: 11              # 5 levels (2.5 kW steps) were too coarse for ~1 kW household loads (pilot: 0.5 % vs 5.0 %)
